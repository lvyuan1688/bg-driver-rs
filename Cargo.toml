[package]
name = "bg-driver-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["lvyuan1688"]
description = "Background computer-use driver for macOS, Windows, and Linux — in Rust. Inspired by trycua/cua."
repository = "https://github.com/lvyuan1688/bg-driver-rs"
keywords = ["ai", "agent", "computer-use", "desktop-automation", "cua"]
categories = ["command-line-utilities", "os"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
image = "0.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
]}

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.1"
core-foundation = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = "2.21"

[workspace]
members = [
    "crates/bg-driver",
    "crates/bg-agent",
    "crates/bg-sandbox",
    "crates/bg-bench",
    "mcp-server",
]
