[package]
name = "bg-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agent loop for bg-driver-rs — Think/Act/Observe state machine"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
bg-driver = { path = "../bg-driver" }
